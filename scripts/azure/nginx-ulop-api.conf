# HTTPS reverse proxy installed only after obtaining the certificate (#75).
# See docs/azure-backend-ci.md for the HTTP-only ACME bootstrap sequence.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name ulop-dev-api.swedencentral.cloudapp.azure.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Refuse TLS handshakes for names other than the configured API hostname.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ulop-dev-api.swedencentral.cloudapp.azure.com;
    ssl_certificate /etc/letsencrypt/live/ulop-dev-api.swedencentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulop-dev-api.swedencentral.cloudapp.azure.com/privkey.pem;
    server_tokens off;
    client_max_body_size 1m;

    # Reject a different HTTP Host even when TLS used the expected SNI.
    if ($host != ulop-dev-api.swedencentral.cloudapp.azure.com) {
        return 404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/v1/development {
        return 404;
    }

    location ^~ /api/v1/development/ {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
