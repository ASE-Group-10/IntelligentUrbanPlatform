# Nginx reverse-proxy site for the Azure development VM (#75).
#
# Install to /etc/nginx/sites-available/ulop-api.conf, symlink into
# /etc/nginx/sites-enabled/ulop-api.conf, remove /etc/nginx/sites-enabled/default,
# test with `sudo nginx -t && sudo systemctl reload nginx`, and provision TLS with:
#   sudo certbot --nginx -d ulop-dev-api.swedencentral.cloudapp.azure.com --redirect
#
# Security boundaries:
# - FastAPI remains bound to 127.0.0.1:8000 (port 8000 is never opened in Azure NSG).
# - Unknown Host headers hit the default_server block and receive 404.
# - Only /health and /api/* (excluding /api/v1/development*) are forwarded;
#   local test views (/, /static/*, /docs, /redoc, /openapi.json) return 404.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name ulop-dev-api.swedencentral.cloudapp.azure.com;
    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location = /api/v1/development {
        return 404;
    }

    location ^~ /api/v1/development/ {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
