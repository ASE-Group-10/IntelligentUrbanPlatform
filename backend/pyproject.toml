[project]
name = "urban-logistics-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pika==1.4.4",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.14.3",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.10.1,<3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
