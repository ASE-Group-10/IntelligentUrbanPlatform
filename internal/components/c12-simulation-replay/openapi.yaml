openapi: 3.1.0
info:
  title: C12 Simulation and Replay HTTP API
  version: 1.0.0
  summary: C01-facing simulation and replay contract proposal.
  description: 'Proposal for Julian and Oscar review under #48; no runtime endpoints are implemented
    by this change. Bearer identity is resolved by C02. Client provider/run/resource IDs are requested
    filters, not authorisation. Every operation enforces roles, provider scope and session ownership
    server-side. Success responses contain the domain value directly; Failure kinds map to HTTP error
    responses. All examples are synthetic. Errors/auth details and transport-only paging/idempotency
    conventions require consumer approval. Cross-field shape conditions use standard JSON Schema if/then/else
    validation. Numeric comparisons across fields/requests and lifecycle transitions still require
    service validation.'
  contact:
    name: Jolin + Qingyuan
servers:
- url: /
  description: Relative platform API URL
tags:
- name: C12 Simulation and Replay
  description: HTTP operations used by C01; internal/event operations stay separate.
security:
- c12BearerAuth: []
paths:
  /api/v1/simulation-runs:
    post:
      operationId: c12StartSimulation
      tags:
      - C12 Simulation and Replay
      summary: Create an isolated simulation run
      description: 'Derive provider/principal from C02; request contains no client-supplied identity.
        Persist immutable manifest/configuration/initial state before generation. Use the existing
        request body''s idempotencyKey (not a second header key): same provider/key/body returns the
        original manifest without another run; changed input conflicts. 201 is a new run, 200 is an
        idempotent receipt. Initial-state refs are opaque, not privileged signed URLs. The generator
        uses isolated adapters and never writes live state. Seed alone is not a reproducibility guarantee.'
      responses:
        '201':
          description: New isolated run manifest; recording is asynchronous.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: True when returning the original receipt. For session responses, poll GET
                session to read latest state.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12RunManifest'
              examples:
                recording:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    schemaVersion: 1
                    runId: 11111111-1111-4111-8111-111111111111
                    providerId: 22222222-2222-4222-8222-222222222222
                    scope: simulation
                    scenarioId: synthetic-dublin-two-deliveries
                    seed: 42
                    configurationVersion: fixture-v1
                    status: recording
                    initialStateRef: fixture://initial-state
                    initialStateSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    availableRanges: []
                    lastSequence: 0
        '200':
          description: Original manifest for an identical idempotent request.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: True when returning the original receipt. For session responses, poll GET
                session to read latest state.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12RunManifest'
              examples:
                recording:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    schemaVersion: 1
                    runId: 11111111-1111-4111-8111-111111111111
                    providerId: 22222222-2222-4222-8222-222222222222
                    scope: simulation
                    scenarioId: synthetic-dublin-two-deliveries
                    seed: 42
                    configurationVersion: fixture-v1
                    status: recording
                    initialStateRef: fixture://initial-state
                    initialStateSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    availableRanges: []
                    lastSequence: 0
        '401':
          $ref: '#/components/responses/C12Unauthenticated'
        '403':
          $ref: '#/components/responses/C12Forbidden'
        '409':
          $ref: '#/components/responses/C12Conflict'
        '422':
          $ref: '#/components/responses/C12Invalid'
        '503':
          $ref: '#/components/responses/C12Unavailable'
      security:
      - c12BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/C12SimulationRequest'
            examples:
              synthetic:
                summary: Synthetic review example; not runtime evidence
                value:
                  scenarioId: synthetic-dublin-two-deliveries
                  seed: 42
                  configurationVersion: fixture-v1
                  idempotencyKey: synthetic-dublin-run-1
    get:
      operationId: c12ListRuns
      tags:
      - C12 Simulation and Replay
      summary: List authorised saved simulation runs
      description: providerId is a requested filter, not authority; reject providers outside C02 scope.
        Return only authorised manifests with recording status and availableRanges. Optional start/end
        must appear together, be UTC, and satisfy start < end; match runs whose availableRanges overlap
        [start,end). No time filter includes runs without available ranges. limit/cursor are HTTP-only
        proposals. Cursor is opaque and bound to principal and all filters; changed filters with an
        old cursor are Invalid. An empty authorised result is 200 items:[], nextCursor:null.
      responses:
        '200':
          description: Bounded run page with reconstructable ranges.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12RunPage'
              examples:
                savedRun:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    items:
                    - schemaVersion: 1
                      runId: 11111111-1111-4111-8111-111111111111
                      providerId: 22222222-2222-4222-8222-222222222222
                      scope: simulation
                      scenarioId: synthetic-dublin-two-deliveries
                      seed: 42
                      configurationVersion: fixture-v1
                      status: completed
                      initialStateRef: fixture://initial-state
                      initialStateSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      availableRanges:
                      - start: '2026-11-17T10:00:00Z'
                        end: '2026-11-17T11:00:00Z'
                      lastSequence: 1
                    nextCursor: null
                empty:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    items: []
                    nextCursor: null
        '401':
          $ref: '#/components/responses/C12Unauthenticated'
        '403':
          $ref: '#/components/responses/C12Forbidden'
        '422':
          $ref: '#/components/responses/C12Invalid'
        '503':
          $ref: '#/components/responses/C12Unavailable'
      security:
      - c12BearerAuth: []
      parameters:
      - name: providerId
        in: query
        required: true
        description: Provider to list; enforce authenticated provider permission.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      - name: scenarioId
        in: query
        required: false
        description: Optional exact scenario ID.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: status
        in: query
        required: false
        description: Optional recording status.
        schema:
          type: string
          enum:
          - recording
          - completed
          - incomplete
      - name: start
        in: query
        required: false
        description: Inclusive available-range overlap filter; requires end.
        schema:
          type: string
          format: date-time
          pattern: Z$
      - name: end
        in: query
        required: false
        description: Exclusive available-range overlap filter; requires start.
        schema:
          type: string
          format: date-time
          pattern: Z$
      - name: limit
        in: query
        required: false
        description: Maximum page size; the server may return fewer items.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        description: Opaque continuation cursor bound to the authenticated principal and unchanged
          filters; never an access grant.
        schema:
          type: string
          minLength: 1
          maxLength: 200
  /api/v1/replay-sessions:
    post:
      operationId: c12StartReplay
      tags:
      - C12 Simulation and Replay
      summary: Start a private replay session
      description: Check principal/run/provider access and verify immutable configuration, a checkpoint
        at/before the requested start, and every essential record. 201 returns a ready/paused initial
        ReplayFrame and a Location for polling. Missing essential data returns 200 CannotReplay (reason
        and availableRanges), with no session created; it is a domain outcome, not a fabricated frame.
        Bad range/speed is 422; a missing/invisible run is 404. Idempotent retries return the original
        result (200 for a replayed successful creation), without duplicate sessions. The speed >0
        and <=16 bound is proposed. Playback reads recorded outcomes/KPIs/evidence and cannot publish
        broker commands, write live state, or rerun today's planner/C09 retrieval.
      responses:
        '201':
          description: New private session and its initial frame.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: True when returning the original receipt. For session responses, poll GET
                session to read latest state.
              schema:
                type: boolean
            Location:
              description: Poll /api/v1/replay-sessions/{sessionId} for this session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12ReplayFrame'
              examples:
                ready:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: ready
                    cursor: 0
                    state:
                      synthetic: true
                      completedDeliveries: 0
                    recordedKpis: []
                    decisionIds: []
                    simulationTime: '2026-11-17T10:00:00Z'
        '200':
          description: CannotReplay without a session, or the original frame on an idempotent retry;
            shapes are disjoint.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: True when returning the original receipt. For session responses, poll GET
                session to read latest state.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/C12CannotReplay'
                - $ref: '#/components/schemas/C12ReplayFrame'
              examples:
                cannotReplay:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    runId: 11111111-1111-4111-8111-111111111111
                    reason: Missing checkpoint or essential event; no synthetic replacement permitted
                    availableRanges: []
                replayedCreation:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: ready
                    cursor: 0
                    state:
                      synthetic: true
                      completedDeliveries: 0
                    recordedKpis: []
                    decisionIds: []
                    simulationTime: '2026-11-17T10:00:00Z'
        '401':
          $ref: '#/components/responses/C12Unauthenticated'
        '403':
          $ref: '#/components/responses/C12Forbidden'
        '404':
          $ref: '#/components/responses/C12NotFound'
        '409':
          $ref: '#/components/responses/C12Conflict'
        '422':
          $ref: '#/components/responses/C12Invalid'
        '503':
          $ref: '#/components/responses/C12Unavailable'
      security:
      - c12BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/C12ReplayRequest'
            examples:
              synthetic:
                summary: Synthetic review example; not runtime evidence
                value:
                  runId: 11111111-1111-4111-8111-111111111111
                  timeRange:
                    start: '2026-11-17T10:00:00Z'
                    end: '2026-11-17T11:00:00Z'
                  speed: 1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Scoped to principal/provider, operation and target. Same key/body returns original
          response; changed input conflicts. Recheck access before replaying a receipt. Required for
          safe create/control retries.
        schema:
          type: string
          minLength: 1
          maxLength: 200
  /api/v1/replay-sessions/{sessionId}:
    get:
      operationId: c12GetReplayFrame
      tags:
      - C12 Simulation and Replay
      summary: Read a replay session frame
      description: C01 polls the latest committed frame; this GET never advances the cursor or starts
        playback. Recheck session ownership/provider/run access. A transient source interruption is
        a 200 paused frame with the last successful state/cursor and interruption reason. A missing/invisible
        session is 404. 503 applies only when no usable session frame can be read. Scheduler advance
        remains internal. decisionIds refer C01 to C10's original run-scoped evidence; C12 does not
        redefine C10 endpoints.
      responses:
        '200':
          description: Latest frame; status may be ready, playing, paused, completed or stopped.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12ReplayFrame'
              examples:
                ready:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: ready
                    cursor: 0
                    state:
                      synthetic: true
                      completedDeliveries: 0
                    recordedKpis: []
                    decisionIds: []
                    simulationTime: '2026-11-17T10:00:00Z'
                interrupted:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: paused
                    cursor: 1
                    state:
                      synthetic: true
                      completedDeliveries: 1
                    recordedKpis:
                    - metricId: delivery-duration
                      value: 600
                      unit: s
                      status: available
                      coverage:
                        eligible: 2
                        observed: 2
                        excluded: 1
                      lastUpdated: '2026-11-17T10:30:00Z'
                      estimated: false
                    interruption: Recording store temporarily unavailable
                    decisionIds: []
                    simulationTime: '2026-11-17T10:10:00Z'
        '401':
          $ref: '#/components/responses/C12Unauthenticated'
        '403':
          $ref: '#/components/responses/C12Forbidden'
        '404':
          $ref: '#/components/responses/C12NotFound'
        '503':
          $ref: '#/components/responses/C12Unavailable'
      security:
      - c12BearerAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        description: Private session ID; server checks owner and run/provider scope on every request.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
  /api/v1/replay-sessions/{sessionId}/controls:
    post:
      operationId: c12ControlReplay
      tags:
      - C12 Simulation and Replay
      summary: Control a private replay session
      description: 'Combine path sessionId with body fields to construct the existing ReplayControl
        model; there is no second sessionId in the body. Validate session ownership, expectedCursor,
        transition, target range and reconstructability before mutation. play: ready->playing; pause:
        playing->paused; resume: paused->playing; seek: ready/playing/paused->paused after checkpoint
        reconstruction; stop: active->stopped. A stale expectedCursor or incompatible transition returns
        409 without cursor/state change. A missing seek target or target on another command is 422.
        Idempotent retry returns the original frame/receipt without executing twice, not the latest
        frame; GET the session for current state. Read interruption during reconstruction returns
        a paused frame preserving the last committed cursor/state. Natural completion is observed
        through GET. Never mutate live plans/resources or publish operational messages.'
      responses:
        '200':
          description: Actual frame after the command, or original idempotent receipt.
          headers:
            Cache-Control:
              description: Do not share/cache authorised results.
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: True when returning the original receipt. For session responses, poll GET
                session to read latest state.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C12ReplayFrame'
              examples:
                seekPaused:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: paused
                    cursor: 0
                    state:
                      synthetic: true
                      completedDeliveries: 0
                    recordedKpis: []
                    decisionIds: []
                    simulationTime: '2026-11-17T10:00:00Z'
                interrupted:
                  summary: Synthetic review example; not runtime evidence
                  value:
                    sessionId: 33333333-3333-4333-8333-333333333333
                    runId: 11111111-1111-4111-8111-111111111111
                    status: paused
                    cursor: 1
                    state:
                      synthetic: true
                      completedDeliveries: 1
                    recordedKpis:
                    - metricId: delivery-duration
                      value: 600
                      unit: s
                      status: available
                      coverage:
                        eligible: 2
                        observed: 2
                        excluded: 1
                      lastUpdated: '2026-11-17T10:30:00Z'
                      estimated: false
                    interruption: Recording store temporarily unavailable
                    decisionIds: []
                    simulationTime: '2026-11-17T10:10:00Z'
        '401':
          $ref: '#/components/responses/C12Unauthenticated'
        '403':
          $ref: '#/components/responses/C12Forbidden'
        '404':
          $ref: '#/components/responses/C12NotFound'
        '409':
          $ref: '#/components/responses/C12Conflict'
        '422':
          $ref: '#/components/responses/C12Invalid'
        '503':
          $ref: '#/components/responses/C12Unavailable'
      security:
      - c12BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/C12ReplayControlCommand'
            examples:
              synthetic:
                summary: Synthetic review example; not runtime evidence
                value:
                  command: seek
                  expectedCursor: 1
                  targetCursor: 0
      parameters:
      - name: sessionId
        in: path
        required: true
        description: Private session ID; server checks owner and run/provider scope on every request.
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      - name: Idempotency-Key
        in: header
        required: true
        description: Scoped to principal/provider, operation and target. Same key/body returns original
          response; changed input conflicts. Recheck access before replaying a receipt. Required for
          safe create/control retries.
        schema:
          type: string
          minLength: 1
          maxLength: 200
components:
  securitySchemes:
    c12BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: C02-issued token
      description: C02 verifies identity and supplies server-side roles/provider permissions. Never
        accept roles or identity from a request body.
  schemas:
    C12SimulationRequest:
      additionalProperties: false
      properties:
        scenarioId:
          maxLength: 200
          minLength: 1
          title: Scenarioid
          type: string
        seed:
          minimum: 0
          title: Seed
          type: integer
        configurationVersion:
          maxLength: 200
          minLength: 1
          title: Configurationversion
          type: string
        idempotencyKey:
          maxLength: 200
          minLength: 1
          title: Idempotencykey
          type: string
      required:
      - scenarioId
      - seed
      - configurationVersion
      - idempotencyKey
      title: C12SimulationRequest
      type: object
      x-python-model: app.components.c12_simulation_replay.contracts.SimulationRequest
    C12TimeRange:
      additionalProperties: false
      description: Half-open [start, end); server must check start < end. JSON Schema does not compare
        these two field values.
      properties:
        start:
          format: date-time
          title: Start
          type: string
          pattern: Z$
          description: UTC ISO 8601 timestamp with Z suffix.
        end:
          format: date-time
          title: End
          type: string
          pattern: Z$
          description: UTC ISO 8601 timestamp with Z suffix.
      required:
      - start
      - end
      title: C12TimeRange
      type: object
    C12RunManifest:
      additionalProperties: false
      properties:
        schemaVersion:
          const: 1
          default: 1
          title: Schemaversion
          type: integer
        runId:
          format: uuid
          title: Runid
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        providerId:
          format: uuid
          title: Providerid
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        scope:
          const: simulation
          default: simulation
          title: Scope
          type: string
        scenarioId:
          maxLength: 200
          minLength: 1
          title: Scenarioid
          type: string
        seed:
          minimum: 0
          title: Seed
          type: integer
        configurationVersion:
          maxLength: 200
          minLength: 1
          title: Configurationversion
          type: string
        status:
          enum:
          - recording
          - completed
          - incomplete
          title: Status
          type: string
        initialStateRef:
          maxLength: 200
          minLength: 1
          title: Initialstateref
          type: string
        initialStateSha256:
          pattern: ^[0-9a-f]{64}$
          title: Initialstatesha256
          type: string
        availableRanges:
          items:
            $ref: '#/components/schemas/C12TimeRange'
          title: Availableranges
          type: array
        lastSequence:
          minimum: 0
          title: Lastsequence
          type: integer
      required:
      - runId
      - providerId
      - scenarioId
      - seed
      - configurationVersion
      - status
      - initialStateRef
      - initialStateSha256
      - availableRanges
      - lastSequence
      title: C12RunManifest
      type: object
      x-python-model: app.components.c12_simulation_replay.contracts.RunManifest
    C12ReplayRequest:
      additionalProperties: false
      properties:
        runId:
          format: uuid
          title: Runid
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        timeRange:
          $ref: '#/components/schemas/C12TimeRange'
        speed:
          default: 1
          exclusiveMinimum: 0
          maximum: 16
          title: Speed
          type: number
      required:
      - runId
      - timeRange
      title: C12ReplayRequest
      type: object
      x-python-model: app.components.c12_simulation_replay.contracts.ReplayRequest
    C12Coverage:
      additionalProperties: false
      description: Counts use the versioned population definition; server checks observed <= eligible,
        and available requires observed == eligible.
      properties:
        eligible:
          minimum: 0
          title: Eligible
          type: integer
        observed:
          minimum: 0
          title: Observed
          type: integer
        excluded:
          default: 0
          minimum: 0
          title: Excluded
          type: integer
      required:
      - eligible
      - observed
      title: C12Coverage
      type: object
    C12Indicator:
      additionalProperties: false
      properties:
        metricId:
          maxLength: 200
          minLength: 1
          title: Metricid
          type: string
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        unit:
          maxLength: 200
          minLength: 1
          title: Unit
          type: string
        status:
          enum:
          - available
          - partial
          - unavailable
          title: Status
          type: string
        coverage:
          $ref: '#/components/schemas/C12Coverage'
        lastUpdated:
          anyOf:
          - format: date-time
            type: string
            pattern: Z$
            description: UTC ISO 8601 timestamp with Z suffix.
          - type: 'null'
          title: Lastupdated
        estimated:
          title: Estimated
          type: boolean
        estimationBasis:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Estimationbasis
        reason:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Reason
      required:
      - metricId
      - value
      - unit
      - status
      - coverage
      - lastUpdated
      - estimated
      title: C12Indicator
      type: object
      description: Recorded C11 Indicator value, exported from the same Python model; no new KPI definition.
      allOf:
      - if:
