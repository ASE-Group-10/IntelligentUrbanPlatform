asyncapi: 3.0.0
info:
  title: C04 Delivery Management Events
  version: 1.0.0
  description: >-
    Events emitted when C04 commits a delivery request or progress change.
    State and the outbox entry are committed atomically. Consumers deduplicate
    by eventId and use deliveryVersion for ordering. These events do not imply
    that a delivery has a feasible plan or confirmed resource allocation.
    Delivery snapshot and progress schemas mirror the C04-owned C04Delivery and
    C04Progress definitions in openapi.yaml (kept in-document because AsyncAPI
    aggregation resolves events.yaml references only).
  contact:
    name: C04 Delivery Management
defaultContentType: application/json
servers:
  rabbitmq:
    host: localhost
    protocol: amqp
    description: Local RabbitMQ topic exchange
channels:
  c04Events:
    address: ulop.events
    messages:
      deliverySubmitted:
        $ref: '#/components/messages/DeliverySubmitted'
      deliveryUpdated:
        $ref: '#/components/messages/DeliveryUpdated'
      deliveryProgressChanged:
        $ref: '#/components/messages/DeliveryProgressChanged'
operations:
  publishDeliverySubmitted:
    action: send
    channel:
      $ref: '#/channels/c04Events'
    title: Publish a delivery submission
    messages:
      - $ref: '#/channels/c04Events/messages/deliverySubmitted'
  publishDeliveryUpdated:
    action: send
    channel:
      $ref: '#/channels/c04Events'
    title: Publish a delivery request update
    messages:
      - $ref: '#/channels/c04Events/messages/deliveryUpdated'
  publishDeliveryProgressChanged:
    action: send
    channel:
      $ref: '#/channels/c04Events'
    title: Publish delivery progress
    messages:
      - $ref: '#/channels/c04Events/messages/deliveryProgressChanged'
components:
  messages:
    DeliverySubmitted:
      name: DeliverySubmitted
      title: Delivery submitted
      summary: A validated delivery request was committed.
      payload:
        $ref: '#/components/schemas/DeliveryEvent'
    DeliveryUpdated:
      name: DeliveryUpdated
      title: Delivery request updated
      summary: Pending delivery request facts were changed.
      payload:
        $ref: '#/components/schemas/DeliveryEvent'
    DeliveryProgressChanged:
      name: DeliveryProgressChanged
      title: Delivery progress changed
      summary: The authoritative progress status changed.
      payload:
        $ref: '#/components/schemas/DeliveryEvent'
  schemas:
    DeliveryEvent:
      allOf:
        - $ref: ../c06-city-monitoring/events.yaml#/components/schemas/EventEnvelope
        - type: object
          required: [eventType, producer, entityVersions, payload]
          properties:
            eventType:
              type: string
              enum: [DeliverySubmitted, DeliveryUpdated, DeliveryProgressChanged]
            producer:
              const: C04
            entityVersions:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
            payload:
              $ref: '#/components/schemas/DeliveryEventPayload'
    DeliveryEventPayload:
      type: object
      additionalProperties: false
      description: >-
        Typed payload for all C04 delivery events. Authoritative progress lives
        exclusively at payload.delivery.progress (never duplicated at top level).
      required: [deliveryId, deliveryVersion, providerId, status, delivery]
      properties:
        deliveryId:
          type: string
          format: uuid
        deliveryVersion:
          type: integer
          minimum: 1
        providerId:
          type: string
          format: uuid
          description: >-
            Authoritative logistics provider UUID owning this delivery request,
            sourced from C04's authenticated provider scope.
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        delivery:
          $ref: '#/components/schemas/DeliverySnapshot'
    DeliverySnapshot:
      type: object
      additionalProperties: false
      description: >-
        Complete typed C04 delivery representation at this version. Mirrors
        C04Delivery in openapi.yaml so C11 and C12 receive authoritative request
        facts (timeWindow, cargo, constraints, status, progress) without
        free-form objects.
      required:
        - deliveryId
        - version
        - status
        - pickup
        - destination
        - cargo
        - timeWindow
        - constraints
        - progress
        - createdAt
        - updatedAt
      properties:
        deliveryId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        pickup:
          $ref: '#/components/schemas/DeliveryLocation'
        destination:
          $ref: '#/components/schemas/DeliveryLocation'
        cargo:
          $ref: '#/components/schemas/DeliveryCargo'
        timeWindow:
          $ref: '#/components/schemas/DeliveryTimeWindow'
        constraints:
          $ref: '#/components/schemas/DeliveryConstraints'
        plannedAt:
          type: [string, 'null']
          format: date-time
        progress:
          $ref: '#/components/schemas/DeliveryProgress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryStatus:
      type: string
      enum: [pending, planned, in_progress, delivered, cancelled]
    DeliveryLocation:
      type: object
      additionalProperties: false
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        instructions:
          type: [string, 'null']
          maxLength: 1000
    DeliveryCargo:
      type: object
      additionalProperties: false
      required: [description, weightKg, parcelCount]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        weightKg:
          type: number
          exclusiveMinimum: 0
        parcelCount:
          type: integer
          minimum: 1
    DeliveryTimeWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    DeliveryConstraints:
      type: object
      additionalProperties: false
      required: [vehicleKinds, fragile]
      properties:
        vehicleKinds:
          type: array
          minItems: 1
          description: Agreed platform vehicle types (van, truck, cargo_bike).
          items:
            type: string
            enum: [van, truck, cargo_bike]
        fragile:
          type: boolean
        temperatureRangeC:
          type: [object, 'null']
          additionalProperties: false
          required: [minimum, maximum]
          properties:
            minimum:
              type: number
            maximum:
              type: number
    DeliveryProgress:
      type: object
      additionalProperties: false
      description: >-
        Single authoritative progress representation on C04 events. Mirrors
        C04Progress in openapi.yaml.
      required: [status, updatedAt]
      properties:
        status:
          type: string
          enum: [pending, picked_up, in_transit, delivered, failed]
        updatedAt:
          type: string
          format: date-time
          description: >-
            Actual business occurrence time (UTC RFC 3339) when this progress
            state took effect (for example, actual delivery completion time when
            status is delivered), not database write time or event emittedAt.
            Consumers must use this timestamp rather than emittedAt for
            delivery-time KPIs.
        note:
          type: [string, 'null']
