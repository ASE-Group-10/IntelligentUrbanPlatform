# Optional synthetic demo only. Workers/setup now live in docker-compose.yml.
# docker compose -f docker-compose.yml -f compose.c11-c12.yml up -d --build
# Reuses the shared image, never starts a second worker for the same queue.
x-analytics-demo: &analytics-demo
  image: ulop-backend:dev
  restart: unless-stopped
  environment: &analytics-env
    DATABASE_URL: postgresql+psycopg://ulop:ulop@db:5432/ulop
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-ulop}:${RABBITMQ_PASSWORD:-ulop}@rabbitmq:5672/%2F
    RABBITMQ_EXCHANGE: ulop.events
  depends_on:
    api:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

services:
  analytics-demo:
    <<: *analytics-demo
    profiles: ["demo"]
    restart: "no"
    entrypoint: ["python", "-m", "app.components.analytics_demo"]
    command: ["--help"]
    environment:
      <<: *analytics-env
      # Deliberately no token default or automatic identity/role provisioning.
      ANALYTICS_DEMO_TOKEN: ${ANALYTICS_DEMO_TOKEN:-}
    volumes:
      - ./contracts:/srv/contracts:ro
    depends_on:
      api:
        condition: service_healthy
      c11-worker:
        condition: service_started
      c12-worker:
        condition: service_started
