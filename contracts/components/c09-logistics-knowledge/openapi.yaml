openapi: 3.1.0
info:
  title: C09 Logistics Knowledge API
  version: 0.1.0
  summary: Curated logistics policy corpus, retrieval and provenance (UC09).
  description: |-
    Draft v0.1 contract for C09, owned by Qingyuan + Bangchen (#13).

    JSON is camelCase; timestamps are UTC ISO 8601 with `Z`; recurring rule times (`timeOfDay`) are Europe/Dublin local `HH:MM`. Unknown fields are rejected.

    Shared C09/C10 types (prefix `C09C10`) are defined here and referenced by the C10 contract.

    This file holds the HTTP operations used by the browser (C01). The in-process
    `queryKnowledge` call from C05/C08 is described in `internal.md`.

    HTTP calls carry a Supabase JWT (`Authorization: Bearer`) and an optional `X-Correlation-Id` header; C10 derives the AuthContext from them.
  contact:
    name: C09 Logistics Knowledge
servers:
- url: /
  description: Relative URL for the deployed platform
tags:
- name: C09 Logistics Knowledge
  description: C09 policy corpus and knowledge retrieval
paths:
  /api/c09/knowledge/query:
    post:
      operationId: queryKnowledge
      summary: Query applicable policy evidence
      description: |-
        Read-only; no idempotency key. Returns passages of the active corpus that apply to the area, time window, vehicle class and activity, ranked by similarity to `freeText`, plus an EvidenceSnapshot that callers pass unchanged to C10 recordDecision. Same request on the same corpusVersion gives the same order.

        **Hard rules are not ranked away.** Every applicable passage that carries constraints is always returned and checked for conflicts; `maxPassages` only limits the rule-free passages. `ruleCoverage` is `Complete` when all applicable hard rules are present; `Incomplete` (explained in `limitations`) means the planner must not rely on them: UC03 returns DataUnavailable and UC07 ReviewRequired without saving a revision.

        **Rule scope.** A constraint applies to route legs and stops inside its `zoneIds`; when `segmentKeys` is non-empty, only on those C06 segments (`seg:<osm_way_id>`). C05 matches them against the segments of the route and stops, so a detour off those segments is not bound by the rule.

        Callers time out after 5 s and treat that as Unavailable. Roles: Service:C05, Service:C08, LogisticsOperator.
      tags:
      - C09 Logistics Knowledge
      security:
      - C09BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/C09PolicyQuery'
            examples:
              hgvDelivery:
                $ref: '#/components/examples/C09QueryKnowledgeRequest'
      responses:
        '200':
          description: Status Ok, LowConfidence, Conflict or NoApplicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C09KnowledgeResult'
              examples:
                ok:
                  $ref: '#/components/examples/C09QueryKnowledgeOkResponse'
                lowConfidence:
                  $ref: '#/components/examples/C09QueryKnowledgeLowConfidenceResponse'
                conflict:
                  $ref: '#/components/examples/C09QueryKnowledgeConflictResponse'
        '400':
          $ref: '#/components/responses/C09Invalid'
        '403':
          $ref: '#/components/responses/C09Forbidden'
        '503':
          $ref: '#/components/responses/C09Unavailable'
  /api/c09/documents:
    post:
      operationId: publishKnowledge
      summary: Publish a curated policy document
      description: 'KnowledgeCurator only. Each Markdown heading with text becomes one passage
        (`sectionId`). Publishing an existing `documentId` creates a new document version
        and corpus version and supersedes the old one. The same idempotencyKey with the same
        body returns the original result with `duplicate: true` (200); with a different body
        it is a Conflict (`C09.IDEMPOTENCY_MISMATCH`). If indexing fails nothing changes and
        the previous corpus stays searchable.'
      tags:
      - C09 Logistics Knowledge
      security:
      - C09BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/C09PublishKnowledgeRequest'
            examples:
              cordon:
                $ref: '#/components/examples/C09PublishKnowledgeRequest'
      responses:
        '201':
          description: New document version activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C09KnowledgePublication'
              examples:
                activated:
                  $ref: '#/components/examples/C09PublishKnowledgeResponse'
        '200':
          description: Duplicate request; the original publication is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/C09KnowledgePublication'
        '400':
          $ref: '#/components/responses/C09Invalid'
        '403':
          $ref: '#/components/responses/C09Forbidden'
        '409':
          $ref: '#/components/responses/C09Conflict'
        '503':
          $ref: '#/components/responses/C09Unavailable'
components:
  securitySchemes:
    C09BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    C09Invalid:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/C09C10ErrorBody'
    C09Forbidden:
      description: The caller may not perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/C09C10ErrorBody'
    C09Conflict:
      description: Idempotency key reuse, ambiguous selector or version conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/C09C10ErrorBody'
    C09Unavailable:
      description: A dependency is temporarily unavailable; retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/C09C10ErrorBody'
  schemas:
    C09Applicability:
      additionalProperties: false
      properties:
        zoneIds:
          items:
            type: string
          type: array
        vehicleClasses:
          items:
            $ref: '#/components/schemas/C09C10VehicleClass'
          type: array
        activities:
          items:
            $ref: '#/components/schemas/C09C10Activity'
          type: array
      required:
      - zoneIds
      - vehicleClasses
      - activities
      type: object
    C09Area:
      additionalProperties: false
      properties:
        zoneIds:
          items:
            type: string
          minItems: 1
          type: array
      required:
      - zoneIds
      type: object
    C09C10Activity:
      enum:
      - Pickup
      - Delivery
      - Transit
      - Loading
      type: string
    C09C10ErrorBody:
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/C09C10Outcome'
        code:
          pattern: ^C\d{2}\.[A-Z_]+$
          type: string
        message:
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
        correlationId:
          format: uuid
          type: string
      required:
      - outcome
      - code
      - message
      - correlationId
      type: object
    C09C10Outcome:
      enum:
      - Ok
      - Invalid
      - Forbidden
      - NotFound
      - Conflict
      - Unavailable
      - Infeasible
      - Partial
      - Unconfirmed
      type: string
    C09C10RunMode:
      enum:
      - Live
      - Simulation
      type: string
    C09C10RunScope:
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/C09C10RunMode'
        runId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
      required:
      - mode
      - runId
      type: object
    C09C10TimeWindow:
      additionalProperties: false
      properties:
        start:
          format: date-time
          type: string
        end:
          format: date-time
          type: string
      required:
      - start
      - end
      type: object
    C09C10VehicleClass:
      description: Team-agreed vehicle types, shared with C04 (#68).
      enum:
      - van
      - truck
      - cargo_bike
      type: string
    C09Constraint:
      additionalProperties: false
      description: |-
        A hard rule the planner applies (C05 #21 review, point 1).

        Scope: the rule applies to a route leg or stop inside ``zoneIds``; when
        ``segmentKeys`` is non-empty, only on those C06 segments (empty = the whole
        zones). Fields required per kind: VehicleBan needs ``value`` null;
        LoadingWindow needs ``timeOfDay`` and ``value`` null; MaxGrossWeight needs
        ``value`` = ``{"maxKg": <positive number>}``.
      properties:
        constraintId:
          type: string
        kind:
          $ref: '#/components/schemas/C09ConstraintKind'
        zoneIds:
          items:
            type: string
          minItems: 1
          type: array
        segmentKeys:
          items:
            pattern: ^seg:[1-9][0-9]*$
            type: string
          type: array
        vehicleClasses:
          items:
            $ref: '#/components/schemas/C09C10VehicleClass'
          type: array
        timeOfDay:
          anyOf:
          - $ref: '#/components/schemas/C09TimeOfDay'
          - type: 'null'
        daysOfWeek:
          items:
            $ref: '#/components/schemas/C09Weekday'
          type: array
        value:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
        exemption:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - constraintId
      - kind
      - zoneIds
      - segmentKeys
      - vehicleClasses
      - timeOfDay
      - daysOfWeek
      - value
      - exemption
      type: object
    C09ConstraintKind:
      enum:
      - VehicleBan
      - LoadingWindow
      - MaxGrossWeight
      type: string
    C09DocumentMetadata:
      additionalProperties: false
      properties:
        documentId:
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
        issuer:
          type: string
        applicability:
          $ref: '#/components/schemas/C09Applicability'
        validFrom:
          format: date-time
          type: string
        validTo:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        constraintsBySection:
          anyOf:
          - additionalProperties:
              items:
                $ref: '#/components/schemas/C09Constraint'
              type: array
            type: object
          - type: 'null'
          default: null
      required:
      - documentId
      - issuer
      - applicability
      - validFrom
      - validTo
      type: object
    C09EvidenceSnapshot:
      additionalProperties: false
      properties:
        ruleCoverage:
          $ref: '#/components/schemas/C09RuleCoverage'
        conflicts:
          items:
            $ref: '#/components/schemas/C09KnowledgeConflict'
          type: array
        limitations:
          items:
            type: string
          type: array
        corpusVersion:
          minimum: 1
          type: integer
        indexVersion:
          type: string
        embeddingModel:
          type: string
        retrievedAt:
          format: date-time
          type: string
        snapshotId:
          format: uuid
          type: string
        query:
          $ref: '#/components/schemas/C09PolicyQuery'
        retrievalStatus:
          $ref: '#/components/schemas/C09RetrievalStatus'
        items:
          items:
            $ref: '#/components/schemas/C09Passage'
          type: array
      required:
      - ruleCoverage
      - conflicts
      - limitations
      - corpusVersion
      - indexVersion
      - embeddingModel
      - retrievedAt
      - snapshotId
      - query
      - retrievalStatus
      - items
      type: object
    C09KnowledgeConflict:
      additionalProperties: false
      properties:
        conflictId:
          format: uuid
          type: string
        passageIds:
          items:
            format: uuid
            type: string
          minItems: 2
          type: array
        reason:
          type: string
      required:
      - conflictId
      - passageIds
      - reason
      type: object
    C09KnowledgeDocument:
      additionalProperties: false
      properties:
        title:
          type: string
        format:
          const: markdown
          type: string
        content:
          minLength: 1
          type: string
      required:
      - title
      - format
      - content
      type: object
    C09KnowledgePublication:
      additionalProperties: false
      properties:
        documentId:
          type: string
        documentVersion:
          minimum: 1
          type: integer
        corpusVersion:
          minimum: 1
          type: integer
        indexVersion:
          type: string
        chunkCount:
          minimum: 1
          type: integer
        activatedAt:
          format: date-time
          type: string
        duplicate:
          type: boolean
      required:
      - documentId
      - documentVersion
      - corpusVersion
      - indexVersion
      - chunkCount
      - activatedAt
      - duplicate
      type: object
    C09KnowledgeResult:
      additionalProperties: false
      properties:
        ruleCoverage:
          $ref: '#/components/schemas/C09RuleCoverage'
        conflicts:
          items:
            $ref: '#/components/schemas/C09KnowledgeConflict'
          type: array
        limitations:
          items:
            type: string
          type: array
        corpusVersion:
          minimum: 1
          type: integer
        indexVersion:
          type: string
        embeddingModel:
          type: string
        retrievedAt:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/C09RetrievalStatus'
        passages:
          items:
            $ref: '#/components/schemas/C09Passage'
          type: array
        evidenceSnapshot:
          $ref: '#/components/schemas/C09EvidenceSnapshot'
      required:
      - ruleCoverage
      - conflicts
      - limitations
      - corpusVersion
      - indexVersion
      - embeddingModel
      - retrievedAt
      - status
      - passages
      - evidenceSnapshot
      type: object
    C09Passage:
      additionalProperties: false
      properties:
        passageId:
          format: uuid
          type: string
        content:
          minLength: 1
          type: string
        documentId:
          type: string
        documentTitle:
          type: string
        documentVersion:
          minimum: 1
          type: integer
        sectionId:
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
        applicability:
          $ref: '#/components/schemas/C09Applicability'
        score:
          maximum: 1
          minimum: 0
          type: number
        constraints:
          items:
            $ref: '#/components/schemas/C09Constraint'
          type: array
      required:
      - passageId
      - content
      - documentId
      - documentTitle
      - documentVersion
      - sectionId
      - validFrom
      - validTo
      - applicability
      - score
      - constraints
      type: object
    C09PolicyQuery:
      additionalProperties: false
      properties:
        area:
          $ref: '#/components/schemas/C09Area'
        timeWindow:
          $ref: '#/components/schemas/C09C10TimeWindow'
        vehicleClass:
          $ref: '#/components/schemas/C09C10VehicleClass'
        activity:
          $ref: '#/components/schemas/C09C10Activity'
        freeText:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          default: null
        maxPassages:
          default: 5
          maximum: 20
          minimum: 1
          type: integer
      required:
      - area
      - timeWindow
      - vehicleClass
      - activity
      type: object
    C09PublishKnowledgeRequest:
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/C09KnowledgeDocument'
        metadata:
          $ref: '#/components/schemas/C09DocumentMetadata'
        idempotencyKey:
          minLength: 1
          type: string
      required:
      - document
      - metadata
      - idempotencyKey
      type: object
    C09RetrievalStatus:
      enum:
      - Ok
      - LowConfidence
      - Conflict
      - NoApplicable
      type: string
    C09RuleCoverage:
      description: |-
        Whether every applicable hard rule (passage with constraints) is returned.

        ``maxPassages`` never cuts a passage that carries constraints; it only limits
        the rule-free passages. ``Incomplete`` means C09 could not return them all;
        C05 must then not rely on the rules (UC03 DataUnavailable, UC07
        ReviewRequired).
      enum:
      - Complete
      - Incomplete
      type: string
    C09TimeOfDay:
      additionalProperties: false
      properties:
        from:
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          type: string
        to:
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          type: string
      required:
      - from
      - to
      type: object
    C09Weekday:
      enum:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
      - Sun
      type: string
  examples:
