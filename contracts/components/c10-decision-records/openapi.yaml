          kind: Predicted
        - metric: cost
          value: 41.5
          unit: EUR
          kind: Predicted
        - metric: co2
          value: 9.8
          unit: kg
          kind: Predicted
        gaps: []
        limitations: []
        generatedAt: '2026-11-20T09:12:44Z'
        generator:
          model: llm-model-tbd
          promptVersion: explain-v1
    C10ExplainDecisionPartialResponse:
      summary: Evidence missing, partial explanation
      value:
        decisionId: d7c6b5a4-9384-4756-a1b2-c3d4e5f60708
        decisionType: PlanGenerated
        subject:
          type: Plan
          id: 9f8e7d6c-5b4a-4392-8170-6f5e4d3c2b1a
          version: 1
        decidedAt: '2026-11-20T06:55:10Z'
        runScope:
