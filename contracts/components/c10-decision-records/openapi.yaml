          documentId: dcc-hgv-cordon
          documentTitle: City Centre HGV Restrictions (demo data)
          documentVersion: 3
          sectionId: '4.2'
          excerpt: Heavy goods vehicles with five or more axles are not permitted to enter
            the city-centre cordon between 07:00 and 19:00 unless a valid permit is held.
        - refId: a3d94e70-2c1f-4b8e-8d55-6e0b7c4f2a02
