          runId: null
        corpusVersion: 7
        mode: StructuredFallback
        completeness: Partial
        summary: null
        keyFactors:
        - text: HGV option excluded by the city-centre cordon ban
          citationRefIds:
          - 5b0c2f1e-8a4d-4c2b-9e61-3f7d2a9c1b01
        - text: Unloading scheduled inside the permitted loading window
          citationRefIds: []
        - text: Lowest predicted cost among feasible options
          citationRefIds: []
        alternatives:
        - optionId: opt-2
          summary: Direct delivery with 5-axle HGV
          rejectedReason: Violates city-centre HGV ban 07:00-19:00 (hard constraint)
          citationRefIds:
          - 5b0c2f1e-8a4d-4c2b-9e61-3f7d2a9c1b01
        - optionId: opt-3
          summary: Van delivery arriving 11:30
          rejectedReason: Outside Grafton Street loading window 06:00-11:00
          citationRefIds: []
        citations:
        - refId: 5b0c2f1e-8a4d-4c2b-9e61-3f7d2a9c1b01
          documentId: dcc-hgv-cordon
          documentTitle: City Centre HGV Restrictions (demo data)
          documentVersion: 3
          sectionId: '4.2'
          excerpt: Heavy goods vehicles with five or more axles are not permitted to enter
            the city-centre cordon between 07:00 and 19:00 unless a valid permit is held.
        effects:
        - metric: eta
          value: 38
          unit: min
          kind: Predicted
        - metric: cost
          value: 41.5
          unit: EUR
          kind: Predicted
        - metric: co2
          value: 9.8
          unit: kg
          kind: Predicted
        gaps:
        - kind: EvidenceMissing
          refId: a3d94e70-2c1f-4b8e-8d55-6e0b7c4f2a02
          message: Evidence item referenced by reason r2 is not available in C10 storage.
        limitations:
        - Explanation generator unavailable; showing recorded facts only.
        generatedAt: '2026-11-20T09:12:44Z'
        generator: null
    C10GetDecisionEvidenceResponse:
      summary: Stored evidence passage
