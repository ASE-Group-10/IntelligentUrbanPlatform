asyncapi: 3.0.0
info:
  title: C12 Simulation and Replay Events
  version: 1.0.0
  description: |
    Proposed receive boundary, not an implemented worker or agreed subscription.
    Preserves the #15/#22 review gate while adopting the component layout (#35).
    C06 owns CityStateUpdated; this consumer references that definition unchanged.
    C04/C05/C08 operational event types and C10 access contracts remain pending
    producer/consumer agreement. No substitute message definitions are invented.
    See internal.md for service boundaries, limitations and remaining agreements.
    C12 publishes no event under this proposal.
  contact:
    name: C12 (Jolin + Qingyuan)
defaultContentType: application/json
servers:
  rabbitmq:
    host: localhost
    protocol: amqp
    description: Local broker; exchange, queue names and subscriptions still need agreement.
channels:
  cityStateInput:
    address: ulop.events
    description: |
      Proposed topic exchange ulop.events, routing key CityStateUpdated, producer C06.
      Queue name and binding are not agreed. This consumer may record the original simulation notification without republishing it.
      The full producer-owned synthetic example is
      ../c06-city-monitoring/examples/city-state-updated-event.json.
    messages:
      cityStateUpdated:
        $ref: '../c06-city-monitoring/events.yaml#/components/messages/CityStateUpdated'
operations:
  receiveCityStateUpdated:
    action: receive
    channel:
      $ref: '#/channels/cityStateInput'
    title: Receive a producer-owned City State notification
    summary: Proposed input; validate producer, schema version and run scope before use.
    messages:
      - $ref: '#/channels/cityStateInput/messages/cityStateUpdated'
    description: |
      Only the simulation recorder consumes broker input. Require scope simulation
      and matching runId; deduplicate eventId atomically with the run-local record.
      A coalesced notification is not a complete source-outcome recording.
      Playback reads saved records and has no broker publication capability.
