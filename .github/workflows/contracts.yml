name: Build API contracts

on:
  pull_request:
    paths:
      - '.redocly.yaml'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '.redocly.yaml'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contract
        run: npm run contracts:lint

      - name: Build Redoc site
        run: npm run contracts:build

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-preview
          path: dist/openapi

  publish:
    name: Publish stable documentation
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Redoc site
        run: npm run contracts:build

      - name: Publish branch documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: ${{ github.ref_name }}/
          clean: false
          single-commit: true
