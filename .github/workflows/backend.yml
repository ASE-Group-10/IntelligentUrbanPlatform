name: Backend checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [develop]
    paths: ['backend/**', 'scripts/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --project backend --locked --python 3.12
      - run: uv run --directory backend pytest
      - run: uv run --project backend ruff check --config backend/pyproject.toml backend scripts
      - run: uv run --project backend ruff format --check --config backend/pyproject.toml backend scripts
      - run: node --check backend/app/static/app.js
