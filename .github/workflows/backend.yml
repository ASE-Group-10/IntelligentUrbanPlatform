name: Backend checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'database/migrations/**'
      - 'scripts/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'scripts/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      # Throwaway database for Postgres-backed tests (see backend/tests/conftest.py).
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: ulop
          POSTGRES_PASSWORD: ulop
          POSTGRES_DB: ulop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ulop -d ulop_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Broker for RabbitMQ publisher tests (see backend/tests/test_c06_rabbitmq_publisher.py).
      rabbitmq:
        image: rabbitmq:4.4.0-management
        env:
          RABBITMQ_DEFAULT_USER: ulop
          RABBITMQ_DEFAULT_PASS: ulop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked dependencies
        run: uv sync --project backend --locked --python 3.12

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgres://ulop:ulop@localhost:5432/ulop_test
          TEST_RABBITMQ_URL: amqp://ulop:ulop@localhost:5672/%2F
        run: uv run --directory backend pytest

      - name: Lint backend
        run: uv run --project backend ruff check --config backend/pyproject.toml backend scripts

      - name: Check backend formatting
        run: uv run --project backend ruff format --check --config backend/pyproject.toml backend scripts

  publish-image:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the tested revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
