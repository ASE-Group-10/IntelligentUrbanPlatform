<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ULOP · Urban Logistics</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        // Must read values the same way as readSavedTheme in src/lib/theme.tsx.
        const raw = localStorage.getItem("ulop-theme");
        const saved = raw === "light" || raw === "dark" ? raw : "system";
        const dark =
          saved === "dark" ||
          (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
